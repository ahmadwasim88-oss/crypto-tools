<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Portfolio Tracker</title>
<style>
:root{
  --bg: #0b0f14;
  --panel: #121820;
  --panel-2: #161e28;
  --border: rgba(255,255,255,0.07);
  --text: #e6edf3;
  --muted: #7d8998;
  --muted-2: #566374;
  --accent: #4c8dff;
  --accent-dim: rgba(76,141,255,0.12);
  --buy: #2fd576;
  --buy-dim: rgba(47,213,118,0.12);
  --sell: #ff5c72;
  --sell-dim: rgba(255,92,114,0.12);
  --dca: #22c1d9;
  --trim: #e8a63b;
  --trim-dim: rgba(232,166,59,0.12);
  --hold: #7d8998;
  --target: #f5d90a;
  --rsi: #c792ea;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Roboto Mono", Consolas, monospace;
  --font-ui: -apple-system, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r-sm: 6px;
  --r-md: 10px;
}
*{ box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
  font-family: var(--font-ui);
  font-size: 13px;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  max-width: 100%;
  overflow-x: hidden;
  overflow-anchor: none;
}
body { padding: 8px 8px calc(52px + env(safe-area-inset-bottom, 0px)); }
.app { max-width: min(100%, 1400px); margin: 0 auto; }
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  padding-bottom: 8px;
  margin-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand h1 {
  margin: 0;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text);
}
.status-panel {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.pill {
  font-size: 11px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  white-space: nowrap;
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.pill.ok { color: var(--buy); background: var(--buy-dim); border-color: rgba(47,213,118,0.25); }
.pill.ok .dot { background: var(--buy); }
.pill.warn { color: var(--trim); background: var(--trim-dim); border-color: rgba(232,166,59,0.25); }
.pill.warn .dot { background: var(--trim); }
.pill.error { color: var(--sell); background: var(--sell-dim); border-color: rgba(255,92,114,0.25); }
.pill.error .dot { background: var(--sell); }
.pill.info { color: var(--muted); background: var(--panel-2); }
.pill.info .dot { background: var(--muted); }
.toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
  position: relative;
}
input[type="text"], input[type="number"] {
  font-family: var(--font-ui);
  padding: 7px 10px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  outline: none;
  font-size: 13px;
}
input[type="text"]:focus, input[type="number"]:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-dim);
}
input::placeholder { color: var(--muted-2); }
.symbol-input { flex: 1; min-width: 0; }
button {
  font-family: var(--font-ui);
  background: var(--accent);
  border: none;
  padding: 7px 14px;
  border-radius: var(--r-sm);
  color: #06101f;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  white-space: nowrap;
  transition: filter 0.12s ease, opacity 0.12s ease;
}
button:hover:not(:disabled) { filter: brightness(1.1); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.table-scroll-wrapper {
  overflow-x: auto;
  overflow-y: visible;
  max-height: none;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  -webkit-overflow-scrolling: touch;
}
table {
  width: 100%;
  border-collapse: collapse;
  background: var(--panel);
  font-size: 11px;
}
th, td { padding: 6px 7px; text-align: left; white-space: nowrap; font-size: 10.5px; }
th.numeric, td.numeric { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
th.center, td.center { text-align: center; }
th {
  background: var(--panel-2);
  font-weight: 600;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
  position: sticky;
  top: 0;
  border-bottom: 1px solid var(--border);
  padding: 8px 10px;
}
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--text); }
.sort-arrow { margin-left: 4px; color: var(--accent); font-weight: 700; }
tbody tr.main-row { border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.12s ease; scroll-margin-top: 40px; }
tbody tr.main-row:hover { background: rgba(255,255,255,0.025); }
tbody tr.main-row:last-child { border-bottom: none; }
td[data-col="coin"] { max-width: 44px; overflow: hidden; text-overflow: ellipsis; }
.coin-name { font-weight: 600; font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; }
.health-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 2px; flex-shrink: 0; }
.target-input {
  width: 82px; text-align: right; padding: 3px 4px; font-size: 10px;
  font-family: inherit; line-height: normal; box-sizing: border-box;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
}
.target-display {
  display: inline-block; padding: 3px 2px; cursor: pointer;
  border-bottom: 1px dashed var(--border);
}
.target-display.target-unset { color: var(--muted-2); }
.gain-pos { color: var(--buy); font-weight: 600; }
.gain-neg { color: var(--sell); font-weight: 600; }
.gain-na { color: var(--muted-2); }
.price-change-24h { display: block; font-size: 9px; font-weight: 600; margin-top: 1px; line-height: 1.1; }
.signal-cell { min-width: 0; }
.signal-wrap { display: flex; align-items: center; justify-content: center; gap: 8px; }
.signal-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 700;
  font-size: 10px;
  letter-spacing: 0.02em;
}
.signal-badge.sell { color: var(--sell); }
.signal-badge.dca { color: var(--dca); }
.signal-badge.trim { color: var(--trim); }
.signal-badge.hold { color: var(--hold); }
.signal-badge.na { color: var(--muted-2); }
.empty-row td { text-align: center; color: var(--muted-2); padding: 32px 12px; }
.detail-row td { padding: 0; background: var(--panel-2); white-space: normal; }
.detail-box { padding: 10px; transition: opacity 0.1s ease; touch-action: pan-y; }
.detail-box.swipe-out { opacity: 0.3; }
.detail-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px 12px;
  margin-bottom: 8px;
  min-width: 0;
}
.detail-group-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 700;
  color: var(--accent);
  margin: 12px 0 6px;
  opacity: 0.85;
}
.detail-group-title:first-child { margin-top: 0; }
.price-bar-wrap { margin: 2px 0 14px; }
.price-bar-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.price-bar-cmp { font-family: var(--font-mono); font-size: 15px; font-weight: 700; color: var(--text); }
.price-bar-change { font-family: var(--font-mono); font-size: 11px; font-weight: 600; }
.price-bar-change.buy { color: var(--buy); }
.price-bar-change.sell { color: var(--sell); }
.price-bar-track { position: relative; height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(255,92,114,0.5) 0%, rgba(86,99,116,0.35) 50%, rgba(47,213,118,0.5) 100%); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); }
.price-bar-marker { position: absolute; top: 50%; width: 15px; height: 15px; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg); transform: translate(-50%, -50%); box-shadow: 0 0 0 2px var(--accent), 0 0 10px 2px rgba(76,141,255,0.55); }
.price-bar-labels { display: flex; justify-content: space-between; margin-top: 4px; font-family: var(--font-mono); font-size: 10px; color: var(--muted-2); }
.detail-item { min-width: 0; }
.detail-item .label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-2); margin-bottom: 2px; }
.detail-item .value { font-family: var(--font-mono); font-size: 12px; font-weight: 600; overflow-wrap: anywhere; }
.detail-item .value.buy { color: var(--buy); }
.detail-item .value.sell { color: var(--sell); }
.detail-item .value.target-pct { color: var(--target); }
.detail-item .value.rsi-value { color: var(--rsi); }
.detail-item .sub-value { font-family: var(--font-mono); font-size: 10px; color: var(--muted-2); margin-top: 2px; }
.detail-item .sub-value.buy { color: var(--buy); }
.detail-item .sub-value.sell { color: var(--sell); }
.detail-reason {
  font-size: 11.5px;
  color: var(--muted);
  line-height: 1.5;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  overflow-wrap: anywhere;
}
.detail-reason b { color: var(--text); }
.detail-remove-btn {
  display: block;
  width: 100%;
  margin-top: 12px;
  background: var(--sell-dim);
  color: var(--sell);
  border: 1px solid rgba(255,92,114,0.25);
}
.dca-log-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.dca-log-status {
  font-size: 11px;
  color: var(--muted-2);
}
.dca-log-actions { display: flex; gap: 6px; flex-shrink: 0; }
.dca-log-btn {
  background: var(--panel);
  color: var(--dca);
  border: 1px solid rgba(34,193,217,0.35);
  font-size: 11.5px;
  padding: 6px 12px;
}
.dca-log-clear-btn {
  background: transparent;
  color: var(--muted-2);
  border: 1px solid var(--border);
  font-size: 11.5px;
  padding: 6px 12px;
}
.chart-toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.chart-toggle-btn {
  background: var(--panel);
  color: var(--accent);
  border: 1px solid rgba(76,141,255,0.3);
  font-size: 11.5px;
  padding: 6px 12px;
}
.chart-external-link {
  font-size: 11px;
  color: var(--muted-2);
  text-decoration: none;
  white-space: nowrap;
}
.chart-external-link:hover { color: var(--accent); }
.chart-container {
  display: none;
  margin-top: 10px;
  border-radius: var(--r-sm);
  overflow: hidden;
  border: 1px solid var(--border);
  min-height: 60px;
  max-width: 100%;
}
.chart-container > div { max-width: 100%; overflow: hidden; }
.chart-loading {
  padding: 24px 12px;
  text-align: center;
  font-size: 11.5px;
  color: var(--muted-2);
}
#suggestBox {
  position: absolute;
  z-index: 40;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  max-height: 260px;
  overflow-y: auto;
  display: none;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.suggestion-item { padding: 8px 12px; cursor: pointer; font-size: 12.5px; border-bottom: 1px solid var(--border); }
.suggestion-item:last-child { border-bottom: none; }
.suggestion-item:hover { background: var(--accent-dim); }
.suggestion-no-result { padding: 10px 12px; color: var(--muted-2); font-size: 12px; }
.activity-log-container {
  position: fixed;
  bottom: 0; left: 0; width: 100%;
  z-index: 50;
  padding: 9px 14px calc(9px + env(safe-area-inset-bottom, 0px));
  background: rgba(6,10,15,0.97);
  border-top: 1px solid var(--border);
  backdrop-filter: blur(6px);
}
.status-line {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted-2);
  white-space: nowrap;
  overflow: hidden;
}
.status-line .sl-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--muted-2);
  flex-shrink: 0;
  transition: background 0.3s ease, box-shadow 0.3s ease;
}
.status-line span#statusLineText {
  overflow: hidden;
  text-overflow: ellipsis;
  transition: color 0.3s ease;
}
.status-line.ok .sl-dot { background: var(--buy); box-shadow: 0 0 6px rgba(47,213,118,0.6); }
.status-line.ok span#statusLineText { color: var(--buy); }
.status-line.warn .sl-dot { background: var(--trim); box-shadow: 0 0 6px rgba(232,166,59,0.6); }
.status-line.warn span#statusLineText { color: var(--trim); }
.status-line.error .sl-dot { background: var(--sell); box-shadow: 0 0 6px rgba(255,92,114,0.6); }
.status-line.error span#statusLineText { color: var(--sell); }
</style>
</head>
<body>
<div class="app">

<header>
  <div class="brand">
    <h1>Portfolio Tracker</h1>
  </div>
  <div class="status-panel">
    <div id="currentStatus" class="pill info"><span class="dot"></span>Initializing…</div>
  </div>
</header>

<div class="toolbar" id="toolbar">
  <input type="text" id="symbolInput" class="symbol-input" placeholder="Type a coin symbol or name to add it…" disabled/>
  <button id="addBtn" disabled>Add coin</button>
  <div id="suggestBox"></div>
</div>

<div class="table-scroll-wrapper">
<table aria-live="polite" id="portfolioTable">
<thead>
<tr>
<th>Coin</th>
<th class="numeric sortable" id="priceSortHeader">Price ₹<span class="sort-arrow" id="priceSortArrow"></span></th>
<th class="numeric">Target ₹</th>
<th class="numeric sortable" id="gainSortHeader">To target<span class="sort-arrow" id="gainSortArrow"></span></th>
<th class="center sortable" id="signalSortHeader">Signal<span class="sort-arrow" id="signalSortArrow"></span></th>
</tr>
</thead>
<tbody id="tableBody">
<tr class="empty-row"><td colspan="5">Loading coin list and prices…</td></tr>
</tbody>
</table>
</div>

</div>

<div id="activityLogContainer" class="activity-log-container">
  <div id="statusLine" class="status-line"><span class="sl-dot"></span><span id="statusLineText">Prices — · TA —</span></div>
</div>

<script defer>
(async function () {

const currentStatus   = document.getElementById('currentStatus');
const statusLine      = document.getElementById('statusLine');
const statusLineText  = document.getElementById('statusLineText');
const symbolInput     = document.getElementById('symbolInput');
const addBtn          = document.getElementById('addBtn');
const tableBody       = document.getElementById('tableBody');
const gainHeader      = document.getElementById('gainSortHeader');
const signalHeader    = document.getElementById('signalSortHeader');
const priceHeader     = document.getElementById('priceSortHeader');
const suggestBox      = document.getElementById('suggestBox');
const gainSortArrow   = document.getElementById('gainSortArrow');
const signalSortArrow = document.getElementById('signalSortArrow');
const priceSortArrow  = document.getElementById('priceSortArrow');

const API_KEY = 'CG-G1MtEv33nwCgRyvF4YNsKyDs';
const API_BASE = 'https://api.coingecko.com/api/v3';

const PRICE_REFRESH_INTERVAL = 2 * 60000;
const API_RECHECK_INTERVAL   = 0.5 * 60000;
const ACTIVITY_TIMEOUT       = 6000;
const ACTIVITY_TIMEOUT_ALERT = 12000;
const MAX_IDS_PER_PRICE_CALL = 90;

const CACHE_KEY      = 'shortfall_coin_list';
const CACHE_DURATION = 7 * 24 * 60 * 60 * 1000;

const TARGET_PROXIMITY_PCT = 3;


const LIQUIDITY_DEAD_RATIO = 0.0005;
const ABSOLUTE_DEAD_VOLUME = 100000;
const MICROCAP_FLOOR = 2000000;
const RANK_CAUTION = 500;

const DCA_EXTREME_PCT = -85;
const DCA_DEEP_PCT = -70;
const DCA_MODERATE_PCT = -40;
const DCA_DIP_WINDOW_DAYS = 90;
const DCA_DIP_NEAR_PCT = 3;
const DCA_VOL_LOOKBACK_DAYS = 20; // used to scale the gap gate to each coin's own volatility
const DCA_GAP_MULT = 3.0;
const DCA_GAP_FLOOR_PCT = 5;
const DCA_GAP_CEIL_PCT = 12;
const REL_STRENGTH_WINDOW_DAYS = 14;
const EMA_TREND_FAST_SHORT = 20, EMA_TREND_FAST_LONG = 50;
const REL_STRENGTH_SCALE = 3;
const REL_STRENGTH_MIN_BONUS = -10;
const REL_STRENGTH_MAX_BONUS = 8;
const DCA_WATCH_PCT = -20;

const CRASH_7D_PCT = -15;

const TA_ALIGN_BUFFER_MS = 15 * 60000;
const TA_HISTORY_DAYS = 365;
const TA_FETCH_DELAY_MS = 1500;

const RSI_PERIOD = 14;
const RSI_OVERSOLD = 30;
const RSI_OVERBOUGHT = 70;
const ATL_PROXIMITY_PCT = 10;

const EMA_TREND_LONG = 200;

const TA_LOGIC_VERSION = 11;
const TA_FETCH_VERSION = 2;

let saved             = JSON.parse(localStorage.getItem('shortfall_portfolio') || '[]');
let pricesCache       = JSON.parse(localStorage.getItem('shortfall_prices') || '{}');
let marketDataCache   = JSON.parse(localStorage.getItem('shortfall_market_data') || '{}');
let holdingSignalCache = JSON.parse(localStorage.getItem('shortfall_holding_signals') || '{}');
let dcaLogCache = JSON.parse(localStorage.getItem('shortfall_dca_log') || '{}');
let taCache            = JSON.parse(localStorage.getItem('shortfall_ta_data') || '{}');

let coinList = [];
let symbolIndex = {};
let portfolioMap = {};

let expandedRowId = null;
let refreshPriceTimer = null;
let recheckTimer = null;
let coinListLoaded = false;

let lastPriceTime = parseInt(localStorage.getItem('shortfall_prices_time') || '0', 10);
let lastTaTime     = parseInt(localStorage.getItem('shortfall_ta_time') || '0', 10);
let taFetchInFlight = false;

let currentSortColumn = 'gain';
let sortDir = 'desc';

const formatTime = (ts) => !ts ? 'N/A' : new Date(ts).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' });
const formatDateTime = (ts) => !ts ? 'N/A' : new Date(ts).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' });
const formatLogTime = () => new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' });
const formatINR = (n, maxDecimals = 2, compact = false) => {
  if (n == null || isNaN(n)) return '—';
  const abs = Math.abs(n);
  if (compact) {
    if (abs >= 1e7) return '₹' + (n / 1e7).toFixed(2) + 'Cr';
    if (abs >= 1e5) return '₹' + (n / 1e5).toFixed(2) + 'L';
  }
  return '₹' + Number(n).toLocaleString('en-IN', { minimumFractionDigits: maxDecimals, maximumFractionDigits: maxDecimals });
};

const pricePrecisionFor = (price) => {
  const abs = Math.abs(price ?? 0);
  if (abs >= 100) return 2;
  if (abs >= 1) return 4;
  if (abs >= 0.01) return 6;
  return 8;
};

const pctToTarget = (cur, tgt) => {
  if (cur == null || tgt == null || isNaN(cur) || isNaN(tgt) || cur === 0) return null;
  return ((tgt - cur) / cur) * 100;
};
const formatPct = (val) => (val == null || isNaN(val)) ? 'N/A' : `${val > 0 ? '+' : ''}${val.toFixed(2)}%`;

const save                 = () => localStorage.setItem('shortfall_portfolio', JSON.stringify(saved));
const savePrices           = () => localStorage.setItem('shortfall_prices', JSON.stringify(pricesCache));
const saveMarketData       = () => localStorage.setItem('shortfall_market_data', JSON.stringify(marketDataCache));
const saveHoldingSignals   = () => localStorage.setItem('shortfall_holding_signals', JSON.stringify(holdingSignalCache));
const saveDcaLog           = () => localStorage.setItem('shortfall_dca_log', JSON.stringify(dcaLogCache));
const saveTaData           = () => localStorage.setItem('shortfall_ta_data', JSON.stringify(taCache));

function buildPortfolioMap() {
  portfolioMap = {};
  saved.forEach(item => { portfolioMap[item.id] = item; });
}

let ambientStatusText = 'Prices — · TA —';
let statusEventActive = false;
let statusEventTimer = null;

function renderAmbientStatus() {
  statusLineText.textContent = ambientStatusText;
  statusLine.className = 'status-line';
}

function updateScheduledStatus() {
  ambientStatusText = `Prices ${formatTime(lastPriceTime)} · TA ${lastTaTime ? formatDateTime(lastTaTime) : 'loading…'}`;
  if (!statusEventActive) renderAmbientStatus();
}

function setCurrentStatus(text, type = 'info') {
  currentStatus.innerHTML = `<span class="dot"></span>${text}`;
  currentStatus.className = 'pill ' + type;
}

function setActivityStatus(text, type = 'info') {
  if (statusEventTimer) clearTimeout(statusEventTimer);
  statusEventActive = true;
  statusLineText.textContent = `${formatLogTime()} — ${text}`;
  statusLine.className = `status-line ${type}`;
  statusEventTimer = setTimeout(() => {
    statusEventActive = false;
    renderAmbientStatus();
  }, (type === 'warn' || type === 'error') ? ACTIVITY_TIMEOUT_ALERT : ACTIVITY_TIMEOUT);
}


function calcEMASeries(values, period) {
  if (values.length < period) return [];
  const k = 2 / (period + 1);
  const out = [];
  let ema = values.slice(0, period).reduce((a, b) => a + b, 0) / period;
  out[period - 1] = ema;
  for (let i = period; i < values.length; i++) {
    ema = values[i] * k + ema * (1 - k);
    out[i] = ema;
  }
  return out;
}

function calcRSISeries(values, period) {
  if (values.length < period + 1) return [];
  const out = new Array(values.length).fill(null);
  let gains = 0, losses = 0;
  for (let i = 1; i <= period; i++) {
    const diff = values[i] - values[i - 1];
    if (diff >= 0) gains += diff; else losses -= diff;
  }
  let avgGain = gains / period, avgLoss = losses / period;
  out[period] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
  for (let i = period + 1; i < values.length; i++) {
    const diff = values[i] - values[i - 1];
    avgGain = (avgGain * (period - 1) + Math.max(diff, 0)) / period;
    avgLoss = (avgLoss * (period - 1) + Math.max(-diff, 0)) / period;
    out[i] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
  }
  return out;
}

function calcReturnPct(closes, days) {
  if (!closes || closes.length < days + 1) return null;
  const start = closes[closes.length - 1 - days];
  const end = closes[closes.length - 1];
  if (start == null || end == null || start === 0) return null;
  return (end - start) / start * 100;
}

function istDateStr(ts) {
  return new Date(ts).toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
}

function calcAvgDailyMovePct(closes, days) {
  if (!closes || closes.length < days + 1) return null;
  const slice = closes.slice(-(days + 1));
  let sum = 0, n = 0;
  for (let i = 1; i < slice.length; i++) {
    const prev = slice[i - 1], cur = slice[i];
    if (prev) { sum += Math.abs((cur - prev) / prev * 100); n++; }
  }
  return n ? sum / n : null;
}

// Walks backward through the coin's actual closing-price history (today's live price appended
// as the final point) to find how many consecutive days the ACCUMULATE conditions — near the
// 90-day low, RSI oversold — have really been true, using each day's own trailing 90-day window
// (no lookahead). This replaced a cache that only counted from whenever the app first happened
// to observe the condition while running, which understated the streak if the app was closed, or
// reset the count whenever the underlying gate logic itself changed. Deliberately doesn't fold in
// the ATL-merge refinement `effectiveLow` applies for today — that only matters in the rare case
// of an ATL older than 90 days that's still the coin's lowest daily close, and isn't reconstructable
// per historical day without full ATL history, so it's left out of this backward walk.
function reconstructStreakDays(closes, cur) {
  if (!closes || !closes.length || cur == null) return 1;
  const series = closes.concat([cur]);
  const rsiSeries = calcRSISeries(series, RSI_PERIOD);
  let streak = 0;
  for (let i = series.length - 1; i >= 0; i--) {
    const rsi = rsiSeries[i];
    if (rsi == null) break;
    const windowStart = Math.max(0, i - DCA_DIP_WINDOW_DAYS + 1);
    let low = Infinity;
    for (let j = windowStart; j <= i; j++) {
      if (series[j] < low) low = series[j];
    }
    const aboveLow = ((series[i] - low) / low) * 100;
    const atLowThatDay = aboveLow <= DCA_DIP_NEAR_PCT && rsi <= RSI_OVERSOLD;
    if (!atLowThatDay) break;
    streak++;
  }
  return streak || 1;
}

function computeTaFromCloses(closes) {
  if (!closes || closes.length < RSI_PERIOD + 1) return null;
  const emaLongSeries = calcEMASeries(closes, EMA_TREND_LONG);
  const rsiSeries = calcRSISeries(closes, RSI_PERIOD);
  const dipWindowCloses = closes.slice(-DCA_DIP_WINDOW_DAYS);
  const rollingLow = dipWindowCloses.length ? Math.min(...dipWindowCloses) : null;
  // dipWindowCloses[last] is the most recent confirmed daily close (1 day ago, since today's
  // in-progress point is dropped by fetchTaHistory) — so days-ago counts back from that index.
  const rollingLowIndex = dipWindowCloses.length ? dipWindowCloses.indexOf(rollingLow) : -1;
  const rollingLowDaysAgo = rollingLowIndex >= 0 ? (dipWindowCloses.length - rollingLowIndex) : null;
  return {
    rsi: rsiSeries.length ? rsiSeries[rsiSeries.length - 1] : null,
    emaLong: emaLongSeries.length ? emaLongSeries[emaLongSeries.length - 1] : null,
    rollingLow,
    rollingLowDaysAgo,
    rollingLowWindowDays: dipWindowCloses.length,
    closes,
    version: TA_LOGIC_VERSION,
    timestamp: Date.now()
  };
}

async function fetchTaHistory(id) {
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000);
    const res = await fetch(`${API_BASE}/coins/${id}/market_chart?vs_currency=inr&days=${TA_HISTORY_DAYS}&interval=daily&x_cg_demo_api_key=${API_KEY}`, { signal: controller.signal });
    clearTimeout(timeoutId);
    if (!res.ok) throw new Error(`HTTP_ERROR:${res.status}`);
    const data = await res.json();
    const points = (data.prices || []).filter(p => p && p[1] != null);
    if (!points.length) return null;
    const lastTs = points[points.length - 1][0];
    const lastIsToday = new Date(lastTs).toISOString().slice(0, 10) === new Date().toISOString().slice(0, 10);
    const usablePoints = lastIsToday ? points.slice(0, -1) : points;
    return usablePoints.map(p => p[1]);
  } catch (err) {
    return null;
  }
}

function auditTa(ta) {
  if (!ta) return true;
  const fields = [ta.rsi, ta.emaLong, ta.rollingLow];
  return fields.every(v => v == null || !isNaN(v));
}

function taBoundaryPassedSince(ts) {
  if (!ts) return true;
  const now = Date.now();
  const d = new Date(now);
  const todaysBoundary = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 0, 0, 0) + TA_ALIGN_BUFFER_MS;
  const mostRecentBoundary = now >= todaysBoundary ? todaysBoundary : todaysBoundary - 24 * 60 * 60000;
  return ts < mostRecentBoundary;
}

async function fetchTaForPortfolio(ids, { force = false } = {}) {
  const hasEnoughHistory = cached => cached.closes && cached.closes.length >= TA_HISTORY_DAYS - 20;

  let recomputed = 0;
  ids.forEach(id => {
    const cached = taCache[id];
    if (cached && cached.fetchVersion === TA_FETCH_VERSION && cached.version !== TA_LOGIC_VERSION && hasEnoughHistory(cached)) {
      const recomputedTa = computeTaFromCloses(cached.closes);
      if (recomputedTa && auditTa(recomputedTa)) {
        recomputedTa.fetchVersion = TA_FETCH_VERSION;
        taCache[id] = recomputedTa;
        recomputed++;
      } else {
        setActivityStatus(`TA audit failed recomputing ${id} — one or more indicators returned NaN, keeping previous values.`, 'warn');
      }
    }
  });
  if (recomputed > 0) {
    saveTaData();
    recomputeHoldingSignals();
    updatePricesInTable();
    setActivityStatus(`Re-applied updated signal logic to ${recomputed} coin(s).`, 'ok');
  }

  const stale = ids.filter(id => {
    const cached = taCache[id];
    if (force || !cached) return true;
    if (cached.fetchVersion !== TA_FETCH_VERSION) return true;
    if (cached.version !== TA_LOGIC_VERSION && !hasEnoughHistory(cached)) return true;
    return taBoundaryPassedSince(cached.timestamp);
  });
  if (!stale.length || taFetchInFlight) return;
  taFetchInFlight = true;
  let updated = 0, auditFailures = 0;
  for (const id of stale) {
    const closes = await fetchTaHistory(id);
    if (closes) {
      const ta = computeTaFromCloses(closes);
      if (ta && auditTa(ta)) {
        ta.fetchVersion = TA_FETCH_VERSION;
        taCache[id] = ta;
        updated++;
      } else if (ta) {
        auditFailures++;
        setActivityStatus(`TA audit failed for ${id} — one or more indicators returned NaN, discarding this fetch.`, 'warn');
      }
    }
    await new Promise(r => setTimeout(r, TA_FETCH_DELAY_MS));
  }
  saveTaData();
  if (updated > 0) {
    lastTaTime = Date.now();
    localStorage.setItem('shortfall_ta_time', lastTaTime);
    recomputeHoldingSignals();
    updatePricesInTable();
    updateScheduledStatus();
  }
  setActivityStatus(`TA history updated (${updated}/${stale.length}).${auditFailures ? ` ${auditFailures} discarded on audit failure.` : ''}`, updated > 0 ? 'ok' : 'warn');
  taFetchInFlight = false;
}


function classifyHolding(md, item, ta, macroTa) {
  if (!md) {
    return {
      signal: 'NA', colorKey: 'na', strength: 0,
      reason: 'No market data yet for this coin — waiting on the next price refresh.',
      volume: null, mcap: null, rank: null, athPct: null, athValue: null, athDate: null, atlValue: null, atlDate: null, low24h: null, high24h: null, volMcapRatio: null
    };
  }
  if (md.notFound) {
    return {
      signal: 'NA', colorKey: 'na', strength: 0,
      reason: 'This coin was not found in the latest CoinGecko market data. It may have been delisted, or the coin ID no longer matches — worth checking manually before assuming anything about the position.',
      volume: null, mcap: null, rank: null, athPct: null, athValue: null, athDate: null, atlValue: null, atlDate: null, low24h: null, high24h: null, volMcapRatio: null
    };
  }

  const volume = md.total_volume;
  const mcap = md.market_cap;
  const rank = md.market_cap_rank;
  const cur = pricesCache[item.id] ?? md.current_price;
  const athValue = (md.ath != null && cur != null) ? Math.max(md.ath, cur) : md.ath;
  const athPct = (athValue != null && cur != null) ? (athValue === md.ath ? md.ath_change_percentage : 0) : md.ath_change_percentage;
  const athDate = md.ath_date;
  // True when today's live price — not CoinGecko's recorded ath/atl_date — is what's setting the
  // extreme, so the recorded date would otherwise go stale next to an updated value.
  const isLiveAth = (athValue != null && cur != null) && athValue === cur && (md.ath == null || cur > md.ath);
  const atlValue = (md.atl != null && cur != null) ? Math.min(md.atl, cur) : md.atl;
  const atlDate = md.atl_date;
  const isLiveAtl = (atlValue != null && cur != null) && atlValue === cur && (md.atl == null || cur < md.atl);
  const low24h = md.low_24h;
  const high24h = md.high_24h;
  const ownReturnPct = calcReturnPct(ta?.closes, REL_STRENGTH_WINDOW_DAYS);
  const btcReturnPct = calcReturnPct(macroTa?.closes, REL_STRENGTH_WINDOW_DAYS);
  const relStrengthVsBtc = (ownReturnPct != null && btcReturnPct != null) ? (ownReturnPct - btcReturnPct) : null;
  // RSI, EMA-200, and the 20/50 sentiment EMAs are recomputed here with today's live price appended
  // as a provisional final point — not read from the once-a-day cached `ta.rsi`/`ta.emaLong`. This
  // keeps them on the same clock as `nearLow` below (which already reacts to live price via
  // effectiveLow); without this they'd lag the near-low check by up to ~24h until the next TA
  // refresh, so a coin could satisfy "near its low" instantly on a sharp intraday move while RSI
  // still showed yesterday's less-extreme reading. `ta.closes`, `rollingLow`, `avgDailyMove`, and
  // the relative-strength returns above intentionally stay closed-candle-only — those are trailing
  // volatility/trend windows, not "current state" reads, so today's still-forming price shouldn't
  // feed into them.
  const liveCloses = (ta?.closes && ta.closes.length && cur != null) ? ta.closes.concat([cur]) : (ta?.closes ?? null);
  const liveRsiSeries = liveCloses ? calcRSISeries(liveCloses, RSI_PERIOD) : [];
  const liveRsi = liveRsiSeries.length ? liveRsiSeries[liveRsiSeries.length - 1] : (ta?.rsi ?? null);
  const liveEmaLongSeries = liveCloses ? calcEMASeries(liveCloses, EMA_TREND_LONG) : [];
  const liveEmaLong = liveEmaLongSeries.length ? liveEmaLongSeries[liveEmaLongSeries.length - 1] : (ta?.emaLong ?? null);
  const emaFastShortSeries = liveCloses ? calcEMASeries(liveCloses, EMA_TREND_FAST_SHORT) : [];
  const emaFastLongSeries = liveCloses ? calcEMASeries(liveCloses, EMA_TREND_FAST_LONG) : [];
  const emaFastShort = emaFastShortSeries.length ? emaFastShortSeries[emaFastShortSeries.length - 1] : null;
  const emaFastLong = emaFastLongSeries.length ? emaFastLongSeries[emaFastLongSeries.length - 1] : null;
  const sentiment = (emaFastShort == null || emaFastLong == null)
    ? null
    : emaFastShort > emaFastLong ? 'Bullish' : emaFastShort < emaFastLong ? 'Bearish' : 'Mixed';

  const noTradingData = (volume == null || mcap == null);
  const zeroMcap = !noTradingData && mcap === 0;
  const volMcapRatio = (!noTradingData && mcap > 0) ? volume / mcap : null;
  const negligibleVolume = !noTradingData && mcap < MICROCAP_FLOOR && volume < ABSOLUTE_DEAD_VOLUME;
  const deadLiquidity = noTradingData || volume === 0 || zeroMcap || negligibleVolume || (volMcapRatio != null && volMcapRatio < LIQUIDITY_DEAD_RATIO);
  const microcap = mcap != null && mcap < MICROCAP_FLOOR;
  const poorRank = rank == null || rank > RANK_CAUTION;
  const atRisk = !deadLiquidity && microcap && poorRank;

  let signal, colorKey, strength, reason;
  const depth = athPct != null ? Math.abs(athPct) : null;

  if (deadLiquidity) {
    signal = 'EXIT'; colorKey = 'sell';
    strength = (noTradingData || zeroMcap) ? 90 : Math.max(60, Math.min(95, Math.round(100 - ((volMcapRatio ?? 0) / LIQUIDITY_DEAD_RATIO) * 40)));
    reason = noTradingData
      ? `No volume or market-cap data from CoinGecko — trading has likely stopped. Verify manually.`
      : zeroMcap
      ? `CoinGecko reports a ₹0 market cap — likely defunct, delisted, or migrated. Verify manually.`
      : negligibleVolume
      ? `Volume (${formatINR(volume)}) is negligible against a ${formatINR(mcap)} market cap. No real market to sell into.`
      : `Volume/market-cap ratio (${(volMcapRatio * 100).toFixed(2)}%) has dried up — there may be no real market left here.`;
  } else if (atRisk) {
    signal = 'AT RISK'; colorKey = 'trim';
    strength = 50;
    reason = `Micro-cap (${formatINR(mcap)}${rank ? `, #${rank}` : ', unranked'}) — real survival risk. Not an exit call, but not a place to add either.`;
  } else if (athPct != null) {
    if (athPct <= DCA_EXTREME_PCT) {
      signal = 'WAIT'; colorKey = 'hold';
      strength = 20;
      reason = `${depth.toFixed(0)}% below ATH — extreme, but depth alone isn't a floor. Watching for a better entry.`;
    } else if (athPct <= DCA_DEEP_PCT) {
      signal = 'WAIT'; colorKey = 'hold';
      strength = 30;
      reason = `${depth.toFixed(0)}% below ATH — deep discount, but that alone doesn't confirm the fall has stopped.`;
    } else if (athPct <= DCA_MODERATE_PCT) {
      signal = 'WAIT'; colorKey = 'hold';
      strength = 25;
      reason = `${depth.toFixed(0)}% below ATH — meaningful discount, but not yet a confirmed add.`;
    } else if (athPct <= DCA_WATCH_PCT) {
      signal = 'HOLD'; colorKey = 'hold';
      strength = 35;
      reason = `Only ${depth.toFixed(0)}% below ATH — not a deep enough discount yet.`;
    } else {
      signal = 'TRIM'; colorKey = 'trim';
      strength = 55;
      reason = `Just ${depth.toFixed(0)}% below ATH — closer to profit-taking than buying.`;
    }
  } else {
    signal = 'HOLD'; colorKey = 'hold';
    strength = 25;
    reason = `No ATH data yet to judge discount.`;
  }

  const atlWithinWindow = (atlDate && ta?.rollingLowWindowDays != null) ? daysSince(atlDate) <= ta.rollingLowWindowDays : false;
  const effectiveLow = (ta?.rollingLow != null && cur != null)
    ? Math.min(ta.rollingLow, cur, (atlWithinWindow && atlValue != null) ? atlValue : Infinity)
    : null;
  // True when today's live price (not a confirmed daily close) is what's setting the low —
  // i.e. the coin is currently probing a fresh low intraday, so this figure will keep moving with price.
  const isLiveLow = (effectiveLow != null && cur != null) && effectiveLow === cur && (ta?.rollingLow == null || cur < ta.rollingLow);
  // Days ago for whichever source actually set effectiveLow: live price (today), a historical
  // ATL that folded in because it's both within the window and lower than the rolling-close low,
  // or the rolling-close low itself (position within the daily-closes window).
  const effectiveLowDaysAgo = isLiveLow
    ? 0
    : (atlWithinWindow && atlValue != null && effectiveLow === atlValue)
      ? daysSince(atlDate)
      : (ta?.rollingLowDaysAgo ?? null);

  const isDiscountCandidate = signal === 'WAIT';
  let dcaStreakDay = null;
  if (isDiscountCandidate) {
    const relStrength = relStrengthVsBtc;
    const relStrengthBonus = relStrength == null ? 0 : Math.max(REL_STRENGTH_MIN_BONUS, Math.min(REL_STRENGTH_MAX_BONUS, relStrength / REL_STRENGTH_SCALE));
    const relStrengthNote = relStrength == null
      ? ''
      : ` ${relStrength > 0 ? 'Outperforming' : 'Underperforming'} BTC (${relStrength >= 0 ? '+' : ''}${relStrength.toFixed(1)}pp over ${REL_STRENGTH_WINDOW_DAYS}d) — ${relStrength > 0 ? 'capital may already be rotating in.' : 'weight this accordingly.'}`;

    if (ta && ta.rollingLow != null && cur != null) {
      const aboveLow = (cur - effectiveLow) / effectiveLow * 100;
      const nearLow = aboveLow <= DCA_DIP_NEAR_PCT;
      const rsiOversold = liveRsi != null && liveRsi <= RSI_OVERSOLD;
      const avgDailyMove = calcAvgDailyMovePct(ta.closes, DCA_VOL_LOOKBACK_DAYS);
      const atLow = nearLow && rsiOversold;
      if (atLow) {
        dcaStreakDay = reconstructStreakDays(ta.closes, cur);

        const lastLog = dcaLogCache[item.id] ?? null;
        const dynGapPct = Math.max(
          DCA_GAP_FLOOR_PCT,
          Math.min(DCA_GAP_CEIL_PCT, (avgDailyMove ?? DCA_GAP_FLOOR_PCT) * DCA_GAP_MULT)
        );
        const gapPct = lastLog != null ? (lastLog.price - cur) / lastLog.price * 100 : null;
        const gapCleared = lastLog == null || gapPct >= dynGapPct;

        if (gapCleared) {
          signal = 'ACCUMULATE'; colorKey = 'dca';
          strength = Math.round(Math.min(60, strength + 30) + relStrengthBonus);
          const gapNote = lastLog == null ? '' : ` Also ${gapPct.toFixed(1)}% below last DCA (${formatINR(lastLog.price, pricePrecisionFor(lastLog.price))}) — a real step down.`;
          const streakNote = dcaStreakDay === 1 ? 'First flagged today.' : `Day ${dcaStreakDay} of this dip.`;
          reason = `${depth.toFixed(0)}% below ATH, ${aboveLow.toFixed(1)}% above its ${ta.rollingLowWindowDays}d low, RSI ${liveRsi.toFixed(0)} (oversold) — conditions met. ${streakNote}${gapNote}${relStrengthNote}`;
        } else {
          const nextDcaPrice = lastLog.price * (1 - dynGapPct / 100);
          const positionNote = gapPct >= 0
            ? `only ${gapPct.toFixed(1)}% below last DCA (${formatINR(lastLog.price, pricePrecisionFor(lastLog.price))})`
            : `${Math.abs(gapPct).toFixed(1)}% above last DCA (${formatINR(lastLog.price, pricePrecisionFor(lastLog.price))}), not below it`;
          reason = `Still meets add conditions (day ${dcaStreakDay}), but ${positionNote}. Needs ≥${dynGapPct.toFixed(1)}% below that — next DCA near ${formatINR(nextDcaPrice, pricePrecisionFor(nextDcaPrice))}. Held at WAIT.${relStrengthNote}`;
        }
      } else {
        if (nearLow && !rsiOversold) {
          reason = `${depth.toFixed(0)}% below ATH, near its ${ta.rollingLowWindowDays}d low, but RSI (${liveRsi == null ? '—' : liveRsi.toFixed(0)}) isn't oversold yet.`;
        } else {
          reason = `${depth.toFixed(0)}% below ATH, but ${Math.abs(aboveLow).toFixed(1)}% ${aboveLow >= 0 ? 'above' : 'below'} its ${ta.rollingLowWindowDays}d low — not near enough yet.`;
        }
      }
    } else {
      reason = `Not enough price history loaded yet to judge proximity to its recent-range low.`;
    }
  }

  const nearTarget = item.target && cur != null ? (cur >= item.target * (1 - TARGET_PROXIMITY_PCT / 100)) : false;
  if (nearTarget && signal !== 'EXIT' && signal !== 'AT RISK') {
    signal = 'TRIM'; colorKey = 'trim';
    strength = 55;
    reason = `Price is at or within ${TARGET_PROXIMITY_PCT}% of your target (₹${item.target}) — worth considering a trim regardless of what the underlying discount signal says.`;
  }

  return {
    signal, colorKey, strength, reason,
    volume, mcap, rank, athPct, athValue, athDate, atlValue, atlDate, isLiveAth, isLiveAtl, low24h, high24h, volMcapRatio,
    change24h: md.change_24h, change7d: md.change_7d, change30d: md.change_30d,
    rsi: liveRsi,
    emaLong: liveEmaLong,
    rollingLow: ta?.rollingLow ?? null,
    effectiveLow,
    effectiveLowDaysAgo,
    isLiveLow,
    rollingLowWindowDays: ta?.rollingLowWindowDays ?? null,
    cmp: cur ?? null,
    relStrengthVsBtc,
    sentiment,
    taStale: !ta,
    dcaStreakDay,
  };
}

let apiWasDown = false;
async function checkApiStatus() {
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 5000);
    const start = performance.now();
    const res = await fetch(`${API_BASE}/ping?x_cg_demo_api_key=${API_KEY}`, { signal: controller.signal });
    clearTimeout(timeoutId);
    if (!res.ok) throw new Error(`HTTP_ERROR:${res.status}`);
    setCurrentStatus(`Live · ${(performance.now() - start).toFixed(0)}ms`, 'ok');
    if (apiWasDown) { setActivityStatus('API reachable again.', 'ok'); apiWasDown = false; }
    return true;
  } catch (err) {
    const message = err.message || '';
    const isNetwork = message.includes('fetch') || err.name === 'TypeError' || err.name === 'AbortError';
    let text = 'Using cached data';
    if (isNetwork) text = 'Connection failed — using cache';
    else if (message.includes('429')) text = 'Rate limited — using cache';
    else if (/5\d{2}/.test(message)) text = 'API down — using cache';
    setCurrentStatus(text, 'error');
    setActivityStatus(text + '.', 'error');
    apiWasDown = true;
    return false;
  }
}

async function loadCoinList(isApiReachable) {
  const cached = localStorage.getItem(CACHE_KEY);
  symbolInput.disabled = false;

  const buildIndex = (list) => {
    symbolIndex = {};
    list.forEach(c => {
      const s = (c.symbol || '').toLowerCase();
      (symbolIndex[s] ||= []).push({ id: c.id, name: c.name, symbol: (c.symbol || '').toUpperCase() });
    });
  };

  if (cached) {
    try {
      const parsed = JSON.parse(cached);
      const list = parsed.list || [];
      if (list.length > 0 && (Date.now() - (parsed.timestamp || 0)) < CACHE_DURATION) {
        coinList = list;
        buildIndex(coinList);
        coinListLoaded = true;
        addBtn.disabled = true;
        symbolInput.placeholder = 'Type a coin symbol or name to add it…';
        setActivityStatus('Coin list loaded from cache.', 'ok');
        return;
      }
    } catch { localStorage.removeItem(CACHE_KEY); }
  }

  if (!isApiReachable) {
    symbolInput.placeholder = 'Coin list unavailable (API down)';
    setActivityStatus('Coin list unavailable — cannot add new coins right now.', 'error');
    return;
  }

  setActivityStatus('Fetching coin list…', 'info');
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 7000);
    const res = await fetch(`${API_BASE}/coins/list?x_cg_demo_api_key=${API_KEY}`, { signal: controller.signal });
    clearTimeout(timeoutId);
    if (!res.ok) throw new Error(`HTTP_ERROR:${res.status}`);
    coinList = await res.json() || [];
    buildIndex(coinList);
    localStorage.setItem(CACHE_KEY, JSON.stringify({ list: coinList, timestamp: Date.now() }));
    coinListLoaded = true;
    addBtn.disabled = true;
    symbolInput.placeholder = 'Type a coin symbol or name to add it…';
    setActivityStatus('Coin list loaded.', 'ok');
  } catch (err) {
    symbolInput.placeholder = 'Coin list unavailable (API failed)';
    setActivityStatus('Coin list failed to load — cannot add new coins right now.', 'error');
  }
}

async function fetchPricesChunk(validIds, attempt = 0) {
  const maxRetries = 2;
  while (attempt <= maxRetries) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 10000);
      const res = await fetch(`${API_BASE}/coins/markets?vs_currency=inr&ids=${validIds.join(',')}&order=market_cap_desc&per_page=250&page=1&sparkline=false&price_change_percentage=7d,30d&x_cg_demo_api_key=${API_KEY}`, { signal: controller.signal });
      clearTimeout(timeoutId);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const foundIds = new Set();
      let updated = 0;
      data.forEach(coin => {
        foundIds.add(coin.id);
        if (coin.current_price != null) { pricesCache[coin.id] = coin.current_price; updated++; }
        marketDataCache[coin.id] = {
          total_volume: coin.total_volume,
          market_cap: coin.market_cap,
          market_cap_rank: coin.market_cap_rank,
          ath: coin.ath,
          ath_change_percentage: coin.ath_change_percentage,
          ath_date: coin.ath_date,
          atl: coin.atl,
          atl_date: coin.atl_date,
          low_24h: coin.low_24h,
          high_24h: coin.high_24h,
          current_price: coin.current_price,
          change_24h: coin.price_change_percentage_24h,
          change_7d: coin.price_change_percentage_7d_in_currency,
          change_30d: coin.price_change_percentage_30d_in_currency,
          notFound: false,
          timestamp: Date.now()
        };
      });
      validIds.forEach(id => {
        if (!foundIds.has(id)) {
          marketDataCache[id] = { notFound: true, timestamp: Date.now() };
        }
      });
      return { updated, total: validIds.length };
    } catch (err) {
      attempt++;
      if (attempt <= maxRetries) await new Promise(r => setTimeout(r, 3000 * attempt));
    }
  }
  return { updated: 0, total: validIds.length };
}

async function fetchPrices(ids) {
  if (!Array.isArray(ids) || !ids.length) return false;
  const validIds = ids.filter(Boolean);
  if (!validIds.length) return false;

  const chunks = [];
  for (let i = 0; i < validIds.length; i += MAX_IDS_PER_PRICE_CALL) chunks.push(validIds.slice(i, i + MAX_IDS_PER_PRICE_CALL));

  const results = await Promise.all(chunks.map(chunk => fetchPricesChunk(chunk)));
  const updated = results.reduce((a, r) => a + r.updated, 0);

  saveMarketData();
  if (updated > 0) {
    lastPriceTime = Date.now();
    localStorage.setItem('shortfall_prices_time', lastPriceTime);
    savePrices();
    updateScheduledStatus();
  }

  if (updated === validIds.length) {
    return true;
  } else if (updated > 0) {
    setActivityStatus(`Prices partially updated (${updated}/${validIds.length}).`, 'warn');
    return true;
  }
  setActivityStatus('Price update failed — showing cached prices.', 'error');
  return false;
}

function recomputeHoldingSignals() {
  const macroTa = taCache['bitcoin'] || null;
  saved.forEach(item => {
    holdingSignalCache[item.id] = classifyHolding(marketDataCache[item.id] || null, item, taCache[item.id] || null, macroTa);
  });
  saveHoldingSignals();
}

function scheduleApiRecheck() {
  if (recheckTimer) clearTimeout(recheckTimer);
  recheckTimer = setTimeout(async () => {
    setActivityStatus('Re-checking API…', 'info');
    const reachable = await checkApiStatus();
    if (reachable) {
      recheckTimer = null;
      refreshPriceTimer = setInterval(schedulePriceFetch, PRICE_REFRESH_INTERVAL);
      const ids = saved.map(s => s.id).filter(Boolean);
      await fetchPrices(ids);
      recomputeHoldingSignals();
      applyCurrentSort();
      fetchTaForPortfolio([...new Set([...ids, 'bitcoin'])]);
    } else {
      scheduleApiRecheck();
    }
  }, API_RECHECK_INTERVAL);
}

async function schedulePriceFetch() {
  const isApiReachable = await checkApiStatus();
  const ids = saved.map(s => s.id).filter(Boolean);
  if (isApiReachable) {
    await fetchPrices(ids);
    recomputeHoldingSignals();
    updatePricesInTable();
    const taIds = [...new Set([...ids, 'bitcoin'])];
    fetchTaForPortfolio(taIds);
  } else {
    updatePricesInTable();
    if (refreshPriceTimer) { clearInterval(refreshPriceTimer); refreshPriceTimer = null; }
    scheduleApiRecheck();
  }
}

const SIGNAL_LABELS_SHORT = {
  'ACCUMULATE': 'ADD', 'HOLD': 'HOLD', 'WAIT': 'WAIT', 'TRIM': 'TRIM',
  'AT RISK': 'RISK', 'EXIT': 'EXIT', 'NA': 'N/A'
};

function healthOf(id) {
  const entry = marketDataCache[id];
  if (!entry || entry.notFound) return { color: 'var(--sell)', shortLabel: 'No data', fresh: false };
  const stale = (Date.now() - entry.timestamp) >= PRICE_REFRESH_INTERVAL * 3;
  return stale
    ? { color: 'var(--trim)', shortLabel: `Stale ${formatTime(entry.timestamp)}`, fresh: false }
    : { color: 'var(--buy)', shortLabel: '', fresh: true };
}

function signalCellHTML(id) {
  const ta = holdingSignalCache[id];
  const health = healthOf(id);
  if (!health.fresh) {
    // Data is stale/missing — the signal was computed from this same data,
    // so it's not trustworthy either. Show only the freshness state, not both.
    const label = health.shortLabel || 'Stale';
    return {
      html: `<div class="signal-wrap">
        <span class="health-dot" style="background:${health.color}"></span>
        <span class="signal-badge na">${label}</span>
      </div>`
    };
  }
  if (!ta || ta.signal === 'NA') {
    return {
      html: `<div class="signal-wrap">
        <span class="health-dot" style="background:${health.color}"></span>
        <span class="signal-badge na">${!marketDataCache[id] ? 'No data' : 'Pending'}</span>
      </div>`
    };
  }
  const label = `${SIGNAL_LABELS_SHORT[ta.signal] || ta.signal} (${ta.strength}%)${ta.signal === 'ACCUMULATE' && ta.dcaStreakDay ? ` · D${ta.dcaStreakDay}` : ''}`;
  const html = `<div class="signal-wrap">
      <span class="health-dot" style="background:${health.color}"></span>
      <span class="signal-badge ${ta.colorKey}">${label}</span>
    </div>`;
  return { html };
}

function removeCoin(id, symbol) {
  if (!confirm(`Remove ${symbol} from your portfolio?`)) return;
  saved = saved.filter(s => s.id !== id);
  save();
  buildPortfolioMap();
  delete pricesCache[id];
  delete marketDataCache[id];
  delete holdingSignalCache[id];
  delete taCache[id];
  delete dcaLogCache[id];
  savePrices();
  saveMarketData();
  saveHoldingSignals();
  saveTaData();
  saveDcaLog();
  if (expandedRowId === id) expandedRowId = null;
  renderTable();
}

function logDcaLevel(id, symbol) {
  const cur = pricesCache[id] ?? marketDataCache[id]?.current_price ?? null;
  const suggested = cur != null ? cur.toString() : '';
  const input = prompt(`Log the price you actually DCA'd ${symbol} at (defaults to current price — edit if you bought at a different price):`, suggested);
  if (input === null) return;
  const price = parseFloat(input);
  if (!price || price <= 0) { alert('Enter a valid price.'); return; }
  dcaLogCache[id] = { price, dateStr: istDateStr(Date.now()), timestamp: Date.now() };
  saveDcaLog();
  recomputeHoldingSignals();
  renderTable();
}

function clearDcaLevel(id, symbol) {
  if (!confirm(`Clear the logged DCA level for ${symbol}? This removes the anchor used to judge whether a future add is meaningfully cheaper.`)) return;
  delete dcaLogCache[id];
  saveDcaLog();
  recomputeHoldingSignals();
  renderTable();
}

let tvScriptPromise = null;
function loadTradingViewScript() {
  if (window.TradingView) return Promise.resolve();
  if (tvScriptPromise) return tvScriptPromise;
  tvScriptPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://s3.tradingview.com/tv.js';
    script.onload = () => resolve();
    script.onerror = () => { tvScriptPromise = null; reject(new Error('TV_SCRIPT_LOAD_FAILED')); };
    document.head.appendChild(script);
  });
  return tvScriptPromise;
}

function toggleChart(id, symbol, btn) {
  const container = document.getElementById(`chart-container-${id}`);
  if (!container) return;
  const isOpen = container.style.display === 'block';
  if (isOpen) {
    container.style.display = 'none';
    btn.textContent = '📈 View chart';
    return;
  }
  container.style.display = 'block';
  btn.textContent = 'Hide chart';
  if (container.dataset.loaded === 'true') return;

  container.innerHTML = '<div class="chart-loading">Loading TradingView chart…</div>';
  loadTradingViewScript().then(() => {
    const widgetId = `tv_widget_${id}`;
    container.innerHTML = `<div id="${widgetId}"></div>`;
    new TradingView.widget({
      width: '100%',
      height: window.innerWidth < 680 ? 280 : 380,
      symbol: `BINANCE:${symbol}USDT*FX_IDC:USDINR`,
      interval: 'D',
      timezone: 'Asia/Kolkata',
      theme: 'dark',
      style: '1',
      locale: 'en',
      toolbar_bg: '#121820',
      backgroundColor: '#121820',
      gridColor: 'rgba(255,255,255,0.06)',
      enable_publishing: false,
      hide_side_toolbar: window.innerWidth < 680,
      save_image: false,
      container_id: widgetId
    });
    container.dataset.loaded = 'true';
  }).catch(() => {
    container.innerHTML = '<div class="chart-loading">Chart failed to load — check your connection.</div>';
  });
}

function priceCellHTML(id, cur) {
  if (!cur) return '<span class="gain-na">—</span>';
  const chg24h = marketDataCache[id]?.change_24h;
  const chgHtml = chg24h == null ? '' : `<span class="price-change-24h ${chg24h >= 0 ? 'gain-pos' : 'gain-neg'}">${formatPct(chg24h)}</span>`;
  return `${formatINR(cur, pricePrecisionFor(cur), true)}${chgHtml}`;
}

function targetCellHTML(item) {
  return item.target == null
    ? `<span class="target-display target-unset" data-id="${item.id}">Set target</span>`
    : `<span class="target-display" data-id="${item.id}">${item.target}</span>`;
}

function beginTargetEdit(span) {
  const id = span.dataset.id;
  const item = saved.find(s => s.id === id);
  if (!item) return;
  const input = document.createElement('input');
  input.type = 'text';
  input.inputMode = 'decimal';
  input.className = 'target-input';
  input.dataset.id = id;
  input.placeholder = 'Target ₹';
  input.value = item.target ?? '';
  span.replaceWith(input);
  input.focus();
  input.select();

  const finalize = () => {
    const value = input.value.trim();
    const newTarget = value === '' ? null : Number(value);
    if (newTarget !== null && (isNaN(newTarget) || newTarget < 0)) {
      setActivityStatus('Target must be a positive number.', 'error');
    } else if (newTarget !== item.target) {
      item.target = newTarget;
      save();
      buildPortfolioMap();
      holdingSignalCache[id] = classifyHolding(marketDataCache[id] || null, item, taCache[id] || null, taCache['bitcoin'] || null);
      saveHoldingSignals();
      setActivityStatus(`Target updated for ${item.symbol}.`, 'info');
      updatePricesInTable();
      if (currentSortColumn === 'gain' || currentSortColumn === 'signal') applyCurrentSort();
    }
    const freshSpan = document.createElement('span');
    freshSpan.className = item.target == null ? 'target-display target-unset' : 'target-display';
    freshSpan.dataset.id = id;
    freshSpan.textContent = item.target == null ? 'Set target' : item.target;
    input.replaceWith(freshSpan);
  };

  input.addEventListener('blur', finalize);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') input.blur();
    if (e.key === 'Escape') { input.value = item.target ?? ''; input.blur(); }
  });
  input.addEventListener('click', (e) => e.stopPropagation());
}

document.addEventListener('click', (e) => {
  if (!e.target.classList.contains('target-display')) return;
  e.stopPropagation();
  beginTargetEdit(e.target);
});

// Swipe left/right on an expanded detail box to jump to the next/previous
// coin in the currently sorted list, without collapsing back to the table.
const SWIPE_MIN_DX = 50;
const SWIPE_EDGE_EXCLUDE_PX = 24; // avoid fighting the browser's edge back/forward gesture
let swipeState = null;

tableBody.addEventListener('touchstart', (e) => {
  const box = e.target.closest('.detail-box');
  if (!box) return;
  if (e.target.closest('button, a, input')) return;
  const t = e.touches[0];
  if (t.clientX < SWIPE_EDGE_EXCLUDE_PX || t.clientX > window.innerWidth - SWIPE_EDGE_EXCLUDE_PX) return;
  swipeState = { box, startX: t.clientX, startY: t.clientY, dx: 0, dy: 0 };
}, { passive: true });

tableBody.addEventListener('touchmove', (e) => {
  if (!swipeState) return;
  const t = e.touches[0];
  swipeState.dx = t.clientX - swipeState.startX;
  swipeState.dy = t.clientY - swipeState.startY;
}, { passive: true });

tableBody.addEventListener('touchend', () => {
  if (!swipeState) return;
  const { box, dx, dy } = swipeState;
  swipeState = null;
  if (Math.abs(dx) < SWIPE_MIN_DX || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  navigateExpandedRow(dx < 0 ? 1 : -1, box);
});

function navigateExpandedRow(direction, box) {
  if (!expandedRowId) return;
  const rows = Array.from(tableBody.querySelectorAll('tr.main-row'));
  const idx = rows.findIndex(r => r.dataset.id === expandedRowId);
  if (idx === -1 || rows.length < 2) return;
  const nextIdx = (idx + direction + rows.length) % rows.length;
  const nextTr = rows[nextIdx];
  const nextItem = portfolioMap[nextTr.dataset.id];
  if (!nextTr || !nextItem) return;

  if (box) {
    box.classList.add('swipe-out');
    setTimeout(() => {
      expandRowCore(nextTr, nextItem, false);
      nextTr.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 90);
  } else {
    expandRowCore(nextTr, nextItem, false);
    nextTr.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function renderTable() {
  if (saved.length === 0) {
    tableBody.innerHTML = '<tr class="empty-row"><td colspan="5">No coins yet — add one above to start tracking signals.</td></tr>';
    return;
  }

  const currentExpandedId = expandedRowId;
  tableBody.innerHTML = '';

  saved.forEach(item => {
    const cur = pricesCache[item.id] ?? null;
    const gain = pctToTarget(cur, item.target);
    const { html: signalHtml } = signalCellHTML(item.id);

    const tr = document.createElement('tr');
    tr.className = 'main-row';
    tr.dataset.id = item.id;
    tr.innerHTML = `
      <td data-col="coin">
        <div class="coin-name">${item.symbol}</div>
      </td>
      <td class="numeric price-cell" data-id="${item.id}">${priceCellHTML(item.id, cur)}</td>
      <td class="numeric">${targetCellHTML(item)}</td>
      <td class="numeric gain-cell ${gain == null ? 'gain-na' : gain >= 0 ? 'gain-pos' : 'gain-neg'}">${formatPct(gain)}</td>
      <td class="center signal-cell">${signalHtml}</td>
    `;

    tr.onclick = (e) => {
      if (e.target.classList.contains('target-input')) return;
      handleRowExpansion(tr, item);
    };

    tableBody.appendChild(tr);
    if (item.id === currentExpandedId) handleRowExpansion(tr, item);
  });
}

function updatePricesInTable() {
  let shouldReSort = false;
  document.querySelectorAll('.price-cell').forEach(priceCell => {
    const id = priceCell.dataset.id;
    const item = portfolioMap[id];
    if (!item) return;
    const cur = pricesCache[id] ?? null;
    const gain = pctToTarget(cur, item.target);
    const row = priceCell.closest('tr.main-row');
    if (!row) return;

    priceCell.innerHTML = priceCellHTML(id, cur);

    const gainCell = row.querySelector('.gain-cell');
    if (gainCell) {
      gainCell.textContent = formatPct(gain);
      gainCell.className = `numeric gain-cell ${gain == null ? 'gain-na' : gain >= 0 ? 'gain-pos' : 'gain-neg'}`;
      const oldGain = parseFloat(row.dataset.gain) || 0;
      const newGain = gain ?? 0;
      if (currentSortColumn === 'gain' && Math.abs(oldGain - newGain) > 0.1) shouldReSort = true;
      row.dataset.gain = newGain;
    }

    const signalCell = row.querySelector('.signal-cell');
    if (signalCell) {
      const { html } = signalCellHTML(id);
      signalCell.innerHTML = html;
    }
  });
  if (shouldReSort) applyCurrentSort();
  else if (expandedRowId) {
    const activeChart = document.getElementById(`chart-container-${expandedRowId}`);
    const chartIsOpen = activeChart && activeChart.dataset.loaded === 'true' && activeChart.style.display === 'block';
    if (!chartIsOpen) {
      const tr = tableBody.querySelector(`tr[data-id="${expandedRowId}"]`);
      const item = portfolioMap[expandedRowId];
      if (tr && item) handleRowExpansion(tr, item, true);
    }
  }
}

function daysSince(dateStr) {
  if (!dateStr) return null;
  const then = new Date(dateStr).getTime();
  if (isNaN(then)) return null;
  return Math.max(0, Math.round((Date.now() - then) / 86400000));
}

function handleRowExpansion(tr, item, forceReExpand = false) {
  const collapsed = expandRowCore(tr, item, forceReExpand);
  if (!forceReExpand && !collapsed) {
    // A fixed delay (not rAF) so this survives the mobile browser's address-bar
    // collapse on the very first scroll gesture of a page load — that collapse
    // resizes the viewport mid-animation and can cancel a scroll timed too early
    // via rAF, which is why this worked from the second click onward but not the first.
    setTimeout(() => {
      tr.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 150);
  }
}

function expandRowCore(tr, item, forceReExpand) {
  const existing = document.querySelector(`.detail-row[data-for="${item.id}"]`);
  if (existing && !forceReExpand) { existing.remove(); expandedRowId = null; return true; }
  if (!forceReExpand) document.querySelectorAll('.detail-row').forEach(r => r.remove());
  else if (existing) existing.remove();

  const ta = holdingSignalCache[item.id];
  const row = document.createElement('tr');
  row.className = 'detail-row';
  row.dataset.for = item.id;

  const removeBtnHtml = `<button type="button" class="detail-remove-btn" data-id="${item.id}" data-symbol="${item.symbol}">Remove ${item.symbol} from portfolio</button>`;
  const chartHtml = `<div class="chart-toggle-row">
      <button type="button" class="chart-toggle-btn" data-id="${item.id}" data-symbol="${item.symbol}">📈 View chart</button>
      <a class="chart-external-link" href="https://www.tradingview.com/chart/?symbol=BINANCE%3A${item.symbol}USDT*FX_IDC%3AUSDINR" target="_blank" rel="noopener">Open in TradingView ↗</a>
    </div>
    <div class="chart-container" id="chart-container-${item.id}"></div>`;

  if (!ta || ta.signal === 'NA') {
    row.innerHTML = `<td colspan="5"><div class="detail-box">
      <div class="detail-reason">${ta ? ta.reason : 'No market data yet for this coin.'}</div>
      ${chartHtml}
      ${removeBtnHtml}
    </div></td>`;
    tr.after(row);
    row.querySelector('.detail-remove-btn').onclick = () => removeCoin(item.id, item.symbol);
    row.querySelector('.chart-toggle-btn').onclick = (e) => toggleChart(item.id, item.symbol, e.currentTarget);
    expandedRowId = item.id;
    return false;
  }

  const ath = ta.isLiveAth ? 0 : daysSince(ta.athDate);
  const atl = ta.isLiveAtl ? 0 : daysSince(ta.atlDate);
  const pctAboveAtl = (ta.cmp != null && ta.atlValue != null && ta.atlValue !== 0) ? ((ta.cmp - ta.atlValue) / ta.atlValue * 100) : null;
  const precision = pricePrecisionFor(ta.cmp);
  const barLow = (ta.low24h != null && ta.cmp != null) ? Math.min(ta.low24h, ta.cmp) : ta.low24h;
  const barHigh = (ta.high24h != null && ta.cmp != null) ? Math.max(ta.high24h, ta.cmp) : ta.high24h;
  const barPct = (barLow != null && barHigh != null && ta.cmp != null && barHigh !== barLow)
    ? Math.max(0, Math.min(100, (ta.cmp - barLow) / (barHigh - barLow) * 100))
    : 50;
  const atlIsCheap = pctAboveAtl != null && pctAboveAtl <= ATL_PROXIMITY_PCT;
  const lowIsNear = (ta.effectiveLow != null && ta.cmp != null) && ((ta.cmp - ta.effectiveLow) / ta.effectiveLow * 100) <= DCA_DIP_NEAR_PCT;
  const lastLog = dcaLogCache[item.id] ?? null;
  const showLogAction = ta.signal === 'ACCUMULATE';
  const dcaLogHtml = (!showLogAction && !lastLog) ? '' : `
    <div class="dca-log-row">
      <span class="dca-log-status">${lastLog ? `Last logged DCA: ${formatINR(lastLog.price, pricePrecisionFor(lastLog.price))} on ${lastLog.dateStr}` : 'No DCA logged yet for this dip.'}</span>
      <div class="dca-log-actions">
        ${lastLog ? `<button type="button" class="dca-log-clear-btn" data-id="${item.id}" data-symbol="${item.symbol}">Clear</button>` : ''}
        ${showLogAction ? `<button type="button" class="dca-log-btn" data-id="${item.id}" data-symbol="${item.symbol}">${lastLog ? 'Update' : 'Log'} DCA</button>` : ''}
      </div>
    </div>`;
  row.innerHTML = `
    <td colspan="5"><div class="detail-box">
      <div class="detail-group-title">Price Action</div>
      <div class="price-bar-wrap">
        <div class="price-bar-header">
          <span class="price-bar-cmp">${ta.cmp == null ? '—' : formatINR(ta.cmp, precision)}</span>
          <span class="price-bar-change ${ta.change24h == null ? '' : ta.change24h >= 0 ? 'buy' : 'sell'}">${ta.change24h == null ? '—' : (ta.change24h >= 0 ? '+' : '') + ta.change24h.toFixed(2) + '% (24h)'}</span>
        </div>
        ${(barLow == null || barHigh == null) ? '' : `
        <div class="price-bar-track"><div class="price-bar-marker" style="left:${barPct}%"></div></div>
        <div class="price-bar-labels"><span>${formatINR(barLow, precision)}</span><span>${formatINR(barHigh, precision)}</span></div>
        `}
      </div>
      <div class="detail-grid">
        <div class="detail-item"><div class="label">7-Day Change</div><div class="value ${ta.change7d != null && ta.change7d <= CRASH_7D_PCT ? 'sell' : ta.change7d != null && ta.change7d > 0 ? 'buy' : ''}">${ta.change7d == null ? '—' : (ta.change7d >= 0 ? '+' : '') + ta.change7d.toFixed(1) + '%'}</div></div>
        <div class="detail-item"><div class="label">30-Day Change</div><div class="value">${ta.change30d == null ? '—' : (ta.change30d >= 0 ? '+' : '') + ta.change30d.toFixed(1) + '%'}</div></div>
        <div class="detail-item">
          <div class="label">All-Time High${ta.isLiveAth ? ' <span>⚡</span>' : ''}</div>
          <div class="value ${ta.athPct != null && ta.athPct <= DCA_MODERATE_PCT ? 'buy' : ta.athPct != null && ta.athPct > DCA_WATCH_PCT ? 'sell' : ''}">${ta.athValue == null ? '—' : formatINR(ta.athValue, precision)}</div>
          <div class="sub-value ${ta.athPct != null && ta.athPct <= DCA_MODERATE_PCT ? 'buy' : ta.athPct != null && ta.athPct > DCA_WATCH_PCT ? 'sell' : ''}">${ta.athPct == null ? '—' : ta.athPct.toFixed(1) + '%'}, ${ta.isLiveAth ? 'today' : (ath == null ? '—' : ath + 'd ago')}</div>
        </div>
        <div class="detail-item">
          <div class="label">All-Time Low${ta.isLiveAtl ? ' <span>⚡</span>' : ''}</div>
          <div class="value ${atlIsCheap ? 'buy' : ''}">${ta.atlValue == null ? '—' : formatINR(ta.atlValue, precision)}</div>
          <div class="sub-value ${atlIsCheap ? 'buy' : ''}">${pctAboveAtl == null ? '—' : (pctAboveAtl >= 0 ? '+' : '') + pctAboveAtl.toFixed(1) + '%'}, ${ta.isLiveAtl ? 'today' : (atl == null ? '—' : atl + 'd ago')}</div>
        </div>
      </div>

      <div class="detail-group-title">Liquidity</div>
      <div class="detail-grid">
        <div class="detail-item"><div class="label">24h Volume</div><div class="value">${ta.volume == null ? '—' : formatINR(ta.volume, 2, true)}</div></div>
        <div class="detail-item"><div class="label">Market Cap</div><div class="value">${ta.mcap == null ? '—' : formatINR(ta.mcap, 2, true)}</div></div>
        <div class="detail-item"><div class="label">Vol / MCap</div><div class="value">${ta.volMcapRatio == null ? '—' : (ta.volMcapRatio * 100).toFixed(3) + '%'}</div></div>
        <div class="detail-item"><div class="label">MCap Rank</div><div class="value">${ta.rank == null ? '—' : '#' + ta.rank}</div></div>
      </div>

      <div class="detail-group-title">Technical Confirmation</div>
      <div class="detail-grid">
        <div class="detail-item"><div class="label">Conviction</div><div class="value">${ta.strength}%</div></div>
        <div class="detail-item"><div class="label">RSI (14, live)</div><div class="value ${ta.rsi != null && ta.rsi <= RSI_OVERSOLD ? 'buy' : ta.rsi != null && ta.rsi >= RSI_OVERBOUGHT ? 'sell' : 'rsi-value'}">${ta.rsi == null ? '—' : ta.rsi.toFixed(0)}</div></div>
        <div class="detail-item"><div class="label">CMP → EMA 200 (live)</div><div class="value target-pct">${(ta.emaLong == null || ta.cmp == null) ? '—' : (((ta.emaLong - ta.cmp) / ta.cmp * 100) >= 0 ? '+' : '') + ((ta.emaLong - ta.cmp) / ta.cmp * 100).toFixed(1) + '% (' + formatINR(ta.emaLong, precision) + ')'}</div></div>
        <div class="detail-item">
          <div class="label">${ta.rollingLowWindowDays || DCA_DIP_WINDOW_DAYS}-Day Low${ta.isLiveLow ? ' <span>⚡</span>' : ''}</div>
          <div class="value ${lowIsNear ? 'buy' : ''}">${ta.effectiveLow == null ? '—' : formatINR(ta.effectiveLow, precision)}</div>
          <div class="sub-value ${lowIsNear ? 'buy' : ''}">${(ta.effectiveLow == null || ta.cmp == null) ? '—' : (((ta.cmp - ta.effectiveLow) / ta.effectiveLow * 100) >= 0 ? '+' : '') + ((ta.cmp - ta.effectiveLow) / ta.effectiveLow * 100).toFixed(1) + '% ' + (((ta.cmp - ta.effectiveLow) / ta.effectiveLow * 100) >= 0 ? 'above' : 'below') + ', ' + (ta.isLiveLow ? 'today' : (ta.effectiveLowDaysAgo == null ? '—' : ta.effectiveLowDaysAgo + 'd ago'))}</div>
        </div>
        <div class="detail-item"><div class="label">Sentiment (20/50 EMA, live)</div><div class="value ${ta.sentiment === 'Bullish' ? 'buy' : ta.sentiment === 'Bearish' ? 'sell' : ''}">${ta.sentiment == null ? '—' : ta.sentiment}</div></div>
        <div class="detail-item"><div class="label">Rel. Strength (${REL_STRENGTH_WINDOW_DAYS}d vs BTC)</div><div class="value ${ta.relStrengthVsBtc > 0 ? 'buy' : ta.relStrengthVsBtc < 0 ? 'sell' : ''}">${ta.relStrengthVsBtc == null ? '—' : (ta.relStrengthVsBtc >= 0 ? '+' : '') + ta.relStrengthVsBtc.toFixed(1) + 'pp (' + (ta.relStrengthVsBtc > 0 ? 'Outperforming' : 'Underperforming') + ')'}</div></div>
      </div>
      ${ta.taStale ? '<div class="detail-reason" style="color:var(--muted-2)">TA history for this coin hasn\'t loaded yet.</div>' : ''}
      <div class="detail-reason"><b>Why:</b> ${ta.reason}</div>
      ${dcaLogHtml}
      ${chartHtml}
      ${removeBtnHtml}
    </div></td>
  `;
  tr.after(row);
  row.querySelector('.detail-remove-btn').onclick = () => removeCoin(item.id, item.symbol);
  row.querySelector('.chart-toggle-btn').onclick = (e) => toggleChart(item.id, item.symbol, e.currentTarget);
  row.querySelector('.dca-log-btn')?.addEventListener('click', () => logDcaLevel(item.id, item.symbol));
  row.querySelector('.dca-log-clear-btn')?.addEventListener('click', () => clearDcaLevel(item.id, item.symbol));
  expandedRowId = item.id;
  return false;
}

function applyCurrentSort() {
  gainSortArrow.textContent = '';
  signalSortArrow.textContent = '';
  priceSortArrow.textContent = '';
  if (currentSortColumn === 'gain') gainSortArrow.textContent = sortDir === 'desc' ? '▼' : '▲';
  else if (currentSortColumn === 'signal') signalSortArrow.textContent = sortDir === 'desc' ? '▼' : '▲';
  else if (currentSortColumn === 'change24h') priceSortArrow.textContent = sortDir === 'desc' ? '▼' : '▲';

  saved.sort((a, b) => {
    let valA, valB;
    if (currentSortColumn === 'gain') {
      const pctA = pctToTarget(pricesCache[a.id], a.target);
      const pctB = pctToTarget(pricesCache[b.id], b.target);
      valA = pctA == null ? -999999 : pctA;
      valB = pctB == null ? -999999 : pctB;
    } else if (currentSortColumn === 'change24h') {
      const chgA = marketDataCache[a.id]?.change_24h;
      const chgB = marketDataCache[b.id]?.change_24h;
      valA = chgA == null ? -999999 : chgA;
      valB = chgB == null ? -999999 : chgB;
    } else {
      valA = holdingSignalCache[a.id]?.strength || 0;
      valB = holdingSignalCache[b.id]?.strength || 0;
    }
    if (valA < valB) return sortDir === 'desc' ? 1 : -1;
    if (valA > valB) return sortDir === 'desc' ? -1 : 1;
    return 0;
  });
  renderTable();
}

addBtn.onclick = async () => {
  if (!coinListLoaded) { setActivityStatus('Coin list not loaded yet — please wait.', 'warn'); return; }
  const rawSymbol = symbolInput.value.trim().toUpperCase();
  const chosenId = symbolInput.dataset.selectedId || null;
  const chosenName = symbolInput.dataset.selectedName || null;
  if (!chosenId) { alert('Please select a coin from the dropdown after typing.'); return; }
  if (saved.some(s => s.id === chosenId)) { alert(`${rawSymbol} is already in your list.`); return; }

  const newCoin = { symbol: rawSymbol, id: chosenId, name: chosenName || chosenId, target: null };
  saved.push(newCoin);
  save();
  buildPortfolioMap();
  symbolInput.value = '';
  delete symbolInput.dataset.selectedId;
  delete symbolInput.dataset.selectedName;
  addBtn.disabled = true;

  const isApiReachable = await checkApiStatus();
  applyCurrentSort();
  await fetchPrices([newCoin.id]);
  recomputeHoldingSignals();
  applyCurrentSort();
  fetchTaForPortfolio([...new Set([newCoin.id, 'bitcoin'])]);
};

gainHeader.addEventListener('click', () => {
  sortDir = currentSortColumn === 'gain' ? (sortDir === 'desc' ? 'asc' : 'desc') : 'desc';
  currentSortColumn = 'gain';
  applyCurrentSort();
});

priceHeader.addEventListener('click', () => {
  sortDir = currentSortColumn === 'change24h' ? (sortDir === 'desc' ? 'asc' : 'desc') : 'desc';
  currentSortColumn = 'change24h';
  applyCurrentSort();
});

signalHeader.addEventListener('click', () => {
  sortDir = currentSortColumn === 'signal' ? (sortDir === 'desc' ? 'asc' : 'desc') : 'desc';
  currentSortColumn = 'signal';
  applyCurrentSort();
});

let suggestTimer;
symbolInput.addEventListener('input', () => {
  clearTimeout(suggestTimer);
  const query = symbolInput.value.trim();
  delete symbolInput.dataset.selectedId;
  delete symbolInput.dataset.selectedName;
  addBtn.disabled = true;
  if (!query) { suggestBox.style.display = 'none'; return; }
  if (!coinListLoaded) {
    suggestBox.innerHTML = '<div class="suggestion-no-result">Coin list unavailable or still loading…</div>';
    positionSuggestBox();
    suggestBox.style.display = 'block';
    return;
  }
  suggestTimer = setTimeout(() => {
    const q = query.toLowerCase();
    const results = [];
    if (symbolIndex[q]) results.push(...symbolIndex[q]);
    if (results.length < 25) {
      coinList.some(c => {
        const s = c.symbol?.toLowerCase() || '';
        const n = c.name?.toLowerCase() || '';
        if (s.includes(q) || n.includes(q)) { results.push({ id: c.id, symbol: c.symbol?.toUpperCase(), name: c.name }); return results.length >= 25; }
        return false;
      });
    }
    suggestBox.innerHTML = results.length
      ? results.map(coin => `<div class="suggestion-item" data-id="${coin.id}" data-symbol="${coin.symbol}" data-name="${(coin.name || '').replace(/"/g, '&quot;')}">${coin.symbol} — ${coin.name}</div>`).join('')
      : '<div class="suggestion-no-result">No results found</div>';
    suggestBox.querySelectorAll('.suggestion-item').forEach(el => {
      el.addEventListener('click', () => {
        symbolInput.value = el.dataset.symbol;
        symbolInput.dataset.selectedId = el.dataset.id;
        symbolInput.dataset.selectedName = el.dataset.name;
        suggestBox.style.display = 'none';
        addBtn.disabled = false;
      });
    });
    positionSuggestBox();
    suggestBox.style.display = 'block';
  }, 250);
});

function positionSuggestBox() {
  const rect = symbolInput.getBoundingClientRect();
  const parentRect = symbolInput.offsetParent.getBoundingClientRect();
  suggestBox.style.top = (rect.bottom - parentRect.top + 4) + 'px';
  suggestBox.style.left = (rect.left - parentRect.left) + 'px';
  suggestBox.style.width = rect.width + 'px';
}

document.addEventListener('click', (e) => {
  if (!symbolInput.contains(e.target) && !suggestBox.contains(e.target)) suggestBox.style.display = 'none';
});

buildPortfolioMap();
renderTable();

const isApiReachable = await checkApiStatus();
await loadCoinList(isApiReachable);

const startIds = saved.map(s => s.id).filter(Boolean);
const startTaIds = [...new Set([...startIds, 'bitcoin'])];
if (isApiReachable) {
  refreshPriceTimer = setInterval(schedulePriceFetch, PRICE_REFRESH_INTERVAL);
  await fetchPrices(startIds);
  recomputeHoldingSignals();
  updateScheduledStatus();
  fetchTaForPortfolio(startTaIds);
} else {
  scheduleApiRecheck();
}

applyCurrentSort();

})();
</script>
</body>
</html>
