<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard with Life Widget</title>
  <style>
    /* --- Page Content --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html,
    body {
      height: 100%;
      width: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #ece9e6, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 10px;
    }
    
    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2vh;
      max-width: 400px;
    }
    
    h1 {
      color: #333;
      font-size: calc(1.8rem + 1vw);
    }
    
    p {
      margin-bottom: 24px;
      color: #666;
      font-size: calc(0.9rem + 0.5vw);
    }

    #elapsedSince {
      margin-top: -14px;
      margin-bottom: 24px;
      font-size: 0.8rem;
      color: #888;
    }
    
    .button-container {
      display: flex;
      flex-direction: column;
      gap: 1.5vh;
      width: 100%;
    }
    
    a {
      text-decoration: none;
      padding: 1em;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      border-radius: 12px;
      font-size: calc(0.9rem + 0.3vw);
      font-weight: 600;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      cursor: pointer;
      word-break: break-word;
    }
    
    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
      background: linear-gradient(135deg, #2575fc, #6a11cb);
    }
    
    /* --- Mini Circular Widget --- */
    #mini {
      position: fixed;
      top: 15px;
      right: 15px;
      width: 50px;
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 9999;
    }
    
    #mini svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    
    #mini circle {
      fill: none;
      stroke-width: 5;
      stroke-linecap: round;
    }
    
    .bg-circle {
      stroke: rgba(0, 0, 0, 0.1);
    }
    
    .progress-circle {
      stroke: #6a11cb;
      stroke-dasharray: 169.646;
      stroke-dashoffset: 169.646;
      transition: stroke-dashoffset 0.5s linear;
    }
    
    .circle-text {
      position: absolute;
      font-size: 0.65rem;
      font-weight: 600;
      color: #6a11cb;
      pointer-events: none;
      text-align: center;
    }
    
    /* --- Expanded Widget Card --- */
    .card {
      position: fixed;
      top: 15px;
      right: 15px;
      width: 220px;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      z-index: 9998;
      color: #fff;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      display: none;
    }
    
    .edit {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: 16px;
      cursor: pointer;
      opacity: 0.8;
    }
    
    .edit:hover {
      opacity: 1;
    }
    
    input,
    button {
      width: 100%;
      padding: 6px;
      margin: 4px 0;
      border-radius: 8px;
      border: none;
      font-size: 0.8rem;
    }
    
    input {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    
    button {
      background: #22c55e;
      cursor: pointer;
      font-weight: 600;
      color: #fff;
    }
    
    #widget {
      margin-top: 8px;
    }
    
    .bar-container {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      overflow: hidden;
      margin: 8px 0;
    }
    
    .fill {
      height: 100%;
      width: 0%;
      background: #fff;
      transition: width 0.5s ease;
    }
    
    .center-text {
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
    }
    
    .countdown {
      font-size: 0.7rem;
      margin-top: 4px;
      opacity: 0.9;
      color: #fff;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .form-error {
      font-size: 0.7rem;
      color: #ffd7d7;
      min-height: 1em;
      margin-top: 2px;
      text-align: left;
    }
  </style>
</head>

<body>
  
  <div class="content">
    <h1>Tool Dashboard</h1>
    <p>Select a tool below to open:</p>
    <p id="elapsedSince">—</p>
    <div class="button-container">
      <a href="Portfolio Tracker.html">Portfolio Tracker</a>
      <a href="Scanner.html">Crypto Scanner</a>
      <a href="CrytoCal.html">CrytoCal</a>
      <a href="Percentage Calculators.html">Percentage Calculators</a>
      <a href="ohlcv.html">OHLCV</a>
    </div>
  </div>
  
  <!-- Mini collapsed -->
  <div id="mini">
    <svg viewBox="0 0 60 60">
      <circle class="bg-circle" cx="30" cy="30" r="27"></circle>
      <circle class="progress-circle" id="progressMini" cx="30" cy="30" r="27"></circle>
    </svg>
    <div class="circle-text" id="percentMini">—%</div>
  </div>
  
  <!-- Expanded Widget -->
  <div class="card" id="card">
    <div class="edit" id="editBtn">✏️</div>
    <div id="settings">
      <label for="birth" class="sr-only">Birthdate</label>
      <input type="date" id="birth" placeholder="Birthdate">
      <label for="age" class="sr-only">Target Age</label>
      <input type="number" id="age" value="75" placeholder="Target Age">
      <div id="formError" class="form-error"></div>
      <button id="save">Save</button>
    </div>
    <div id="widget">
      <div class="bar-container">
        <div class="fill" id="fill"></div>
      </div>
      <div class="center-text" id="percentBar">—% remaining</div>
      <div class="countdown" id="countdown">—</div>
      <div class="countdown" id="daysPassed">—</div>
      <div class="countdown" id="deathDate">—</div>
    </div>
  </div>
  
  <script>
    const mini = document.getElementById("mini"),
      card = document.getElementById("card"),
      settings = document.getElementById("settings"),
      widget = document.getElementById("widget"),
      fill = document.getElementById("fill"),
      percentBar = document.getElementById("percentBar"),
      countdown = document.getElementById("countdown"),
      deathDateEl = document.getElementById("deathDate"),
      daysPassedEl = document.getElementById("daysPassed"),
      progressMini = document.getElementById("progressMini"),
      percentMini = document.getElementById("percentMini"),
      editBtn = document.getElementById("editBtn"),
      bInput = document.getElementById("birth"),
      aInput = document.getElementById("age"),
      formError = document.getElementById("formError");
    
    let collapsed = true;
    let intervalId = null;
    let widgetActive = false; // true once a valid birthdate/age has been loaded or saved

    function startTicking() {
      if (intervalId) clearInterval(intervalId);
      intervalId = setInterval(update, 1000);
    }

    function stopTicking() {
      if (intervalId) {
        clearInterval(intervalId);
        intervalId = null;
      }
    }

    // Pause the 1s tick while the tab isn't visible; resume (and catch up) when it is again
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        stopTicking();
      } else if (widgetActive) {
        update();
        startTicking();
      }
    });

    // Returns an error message string, or null if the inputs are valid
    function validateInputs(birthStr, ageStr) {
      if (!birthStr || !ageStr) return "Please fill in both fields.";

      const birth = new Date(birthStr);
      if (isNaN(birth.getTime())) return "Enter a valid birthdate.";

      const endOfToday = new Date();
      endOfToday.setHours(23, 59, 59, 999);
      if (birth > endOfToday) return "Birthdate can't be in the future.";

      const age = Number(ageStr);
      if (!Number.isFinite(age) || age <= 0) return "Target age must be greater than 0.";
      if (age > 130) return "Target age seems unrealistic — try a lower number.";

      return null;
    }

    const MS = { SEC: 1000, MIN: 60 * 1000, HOUR: 3600 * 1000, DAY: 24 * 3600 * 1000 };
    MS.YEAR_APPROX = 365.25 * MS.DAY;
    MS.MONTH_APPROX = 30 * MS.DAY;

    // Breaks a millisecond duration into y/m/d/h/m/s (approximate, calendar-agnostic).
    // Used for the two countdown-style displays where sub-day precision matters.
    function breakdownDuration(ms) {
      const years = Math.floor(ms / MS.YEAR_APPROX); ms -= years * MS.YEAR_APPROX;
      const months = Math.floor(ms / MS.MONTH_APPROX); ms -= months * MS.MONTH_APPROX;
      const days = Math.floor(ms / MS.DAY); ms -= days * MS.DAY;
      const hours = Math.floor(ms / MS.HOUR); ms -= hours * MS.HOUR;
      const mins = Math.floor(ms / MS.MIN); ms -= mins * MS.MIN;
      const secs = Math.floor(ms / MS.SEC);
      return { years, months, days, hours, mins, secs };
    }

    function formatYMDHMS({ years, months, days, hours, mins, secs }) {
      return `${years}y ${months}m ${days}d ${hours}h ${mins}m ${secs}s`;
    }

    // Calendar-accurate elapsed time (no drift, unlike breakdownDuration above) —
    // used only for the fixed "Since 17 Apr 2021" label.
    function getElapsedYMD(fromDate, toDate) {
      let years = toDate.getFullYear() - fromDate.getFullYear();
      let months = toDate.getMonth() - fromDate.getMonth();
      let days = toDate.getDate() - fromDate.getDate();

      if (days < 0) {
        months--;
        const prevMonth = new Date(toDate.getFullYear(), toDate.getMonth(), 0);
        days += prevMonth.getDate();
      }
      if (months < 0) {
        years--;
        months += 12;
      }
      return { years, months, days };
    }

    function updateElapsedSince() {
      const from = new Date(2021, 3, 17); // 17 April 2021 (month is 0-indexed)
      const { years, months, days } = getElapsedYMD(from, new Date());
      document.getElementById("elapsedSince").textContent =
        `Since 17 Apr 2021: ${years}y ${months}m ${days}d`;
    }
    updateElapsedSince();
    setInterval(updateElapsedSince, 60 * 1000); // day-granularity, no need to tick every second

    function update() {
      if (!bInput.value) return;

      const birth = new Date(bInput.value),
        targetAge = parseInt(aInput.value),
        now = new Date(),
        end = new Date(bInput.value);

      end.setFullYear(end.getFullYear() + targetAge);

      const total = end - birth,
        lived = now - birth,
        completed = Math.min(100, (lived / total * 100)),
        remaining = Math.max(0, (100 - completed).toFixed(1));

      fill.style.width = completed + "%";
      percentBar.textContent = remaining + "% remaining";
      deathDateEl.textContent = "DoD: " + end.toDateString();

      daysPassedEl.textContent = "Passed: " + formatYMDHMS(breakdownDuration(lived));

      const remainingMs = Math.max(0, end - now);
      countdown.textContent = "Left: " + formatYMDHMS(breakdownDuration(remainingMs));

      if (collapsed) {
        mini.style.display = "flex";
        const circumference = 2 * Math.PI * 27;
        progressMini.style.strokeDasharray = circumference;
        progressMini.style.strokeDashoffset = circumference * (1 - completed / 100);
        percentMini.textContent = remaining + "%";
      }
    }

    // Load saved (wrapped: localStorage can throw in some private-browsing modes)
    try {
      if (localStorage.birth && localStorage.age && !validateInputs(localStorage.birth, localStorage.age)) {
        bInput.value = localStorage.birth;
        aInput.value = localStorage.age;
        settings.style.display = 'none';
        widget.style.display = 'none';
        mini.style.display = 'flex';
        collapsed = true;
        widgetActive = true;
        update();
        startTicking();
      }
    } catch (err) {
      console.warn("Couldn't read saved widget settings:", err);
    }

    // Save
    document.getElementById("save").addEventListener("click", (e) => {
      e.stopPropagation();
      const error = validateInputs(bInput.value, aInput.value);
      formError.textContent = error || "";
      if (error) return;

      try {
        localStorage.birth = bInput.value;
        localStorage.age = aInput.value;
      } catch (err) {
        console.warn("Couldn't persist widget settings:", err);
      }
      settings.style.display = 'none';
      widget.style.display = 'block';
      mini.style.display = 'none';
      editBtn.style.display = 'block';
      collapsed = false;
      widgetActive = true;
      update();
      startTicking();
    });
    
    // Edit
    editBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      formError.textContent = "";
      settings.style.display = 'block';
      widget.style.display = 'none';
      mini.style.display = 'none';
      editBtn.style.display = 'none';
    });
    
    // Toggle collapsed/expanded
    mini.addEventListener("click", (e) => {
      e.stopPropagation();
      mini.style.display = 'none';
      card.style.display = 'block';
      settings.style.display = 'none';
      widget.style.display = 'block';
      editBtn.style.display = 'block';
      collapsed = false;
    });
    card.addEventListener("click", (e) => {
      if (settings.style.display === 'block') return;
      collapsed = !collapsed;
      if (collapsed) {
        card.style.display = 'none';
        mini.style.display = 'flex';
        editBtn.style.display = 'none';
      }
    });

    // Collapse when clicking anywhere outside the widget
    document.addEventListener("click", (e) => {
      if (collapsed) return;                              // already collapsed
      if (settings.style.display === 'block') return;      // don't interrupt editing
      if (card.contains(e.target) || mini.contains(e.target)) return; // click was inside widget
      collapsed = true;
      card.style.display = 'none';
      mini.style.display = 'flex';
      editBtn.style.display = 'none';
    });
  </script>
</body>

</html>
